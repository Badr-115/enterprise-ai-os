name: TEMPORARY one-shot Next.js security lockfile upgrade

on:
  push:
    branches: [verify/live-runtime-smoke-2026-11-04]
    paths: [.github/workflows/refresh-next-lockfile.yml]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.repository == 'Badr-115/enterprise-ai-os' && github.ref == 'refs/heads/verify/live-runtime-smoke-2026-11-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade just Next.js to patched 16.4.1, verify lockfile and production advisory
        working-directory: enterprise-intelligence-os-main/frontend
        run: |
          npm install next@16.4.1 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node -e "const p=require('./node_modules/next/package.json'); if(p.version !== '16.4.1') process.exit(1); console.log('verified next='+p.version)"
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit only verified package manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enterprise-intelligence-os-main/frontend/package.json enterprise-intelligence-os-main/frontend/package-lock.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Next.js to patched 16.4.1"
            git push origin HEAD:verify/live-runtime-smoke-2026-11-04
          fi
